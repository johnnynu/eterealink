name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure
      - name: Initialize Terraform without remote state
        run: terraform -chdir=infrastructure init -backend=false -input=false
      - name: Validate Terraform
        run: terraform -chdir=infrastructure validate
      - name: Initialize bootstrap Terraform
        run: terraform -chdir=infrastructure/bootstrap init -backend=false -input=false
      - name: Validate bootstrap Terraform
        run: terraform -chdir=infrastructure/bootstrap validate
